<script>
    const acc = document.querySelectorAll(".table-data");
    const show = document.querySelectorAll(".acc-content")
    // const content = e.querySelector('.acc-content');
    
    function expand(e) {

        acc.forEach(item => {

            if (item === e) {
                e.classList.toggle("expand")

            }else{
                item.classList.remove("expand")
            }
        })
    }
