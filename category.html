<!DOCTYPE html>
<head>
    <title>Our Coffees - Purr n Pour</title>
    <link rel="stylesheet" href="./css/mainlayout.css">
    <link rel="stylesheet" href="./css/category.css"> 
    <script  src="./mainlayout/footer.js" defer> </script>
</head>
<body>
    
    <div class="dashboard">
        <a href="/">
            <div>
                <img id="logo" src="./pics/logo.svg">
                <p id="name">Purr n Pour</p>
            </div>
        </a>
        
        <div id="end-div">
            <p><a href="#">Shop</a></p>
            <p><a href="#">About us</a></p>
            <a href="#">
                <img id="cart" src="./pics/cart.svg">
            </a>
        </div>
    </div>

    <main>
        <section class="above-pic">
            <img src="./pics/coffeebeans.svg" class="above-pic-bg">
        </section>

        <section class="product-category">
                <div class="category-header">
                    <select class="category">
                        <option value="HOT-COFFEE">HOT-COFFEE</option>
                        <option value="COLD-COFFEE">COLD-COFFEE</option>
                        <option value="NON-CAFFEINATED">NON-CAFFEINATED</option>
                    </select>
                </div>

            <div class="product-grid">
                <div class="product-item">
                    <img src="./pics/latte.svg" class="product-item-image">
                    <p class="product-item-name">Latte</p>
                </div>

                <div class="product-item">
                    <img src="./pics/flat white.svg" class="product-item-image">
                    <p class="product-item-name">Flat White</p>
                </div>

                <div class="product-item">
                    <img src="./pics/espresso.svg" class="product-item-image">
                    <p class="product-item-name">Espresso</p>
                </div>
            </div>
        </section>
    </main>
    
    <add-footer></add-footer>
    
</body>
</html>
