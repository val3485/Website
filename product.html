<!DOCTYPE html>
<html lang="en">
<head>
    <title>Cold Brew with Milk - Purr n Pour</title>
    <link rel="stylesheet" href="./css/mainlayout.css">
    <link rel="stylesheet" href="./css/product.css">
    <script src="./js/footer.js" defer></script>
</head>
<body>
    
    <div class="dashboard">
        <a href="/">
            <div>
                <img id="logo" src="./pics/logo.svg" alt="Purr n Pour Logo">
                <p id="name">Purr n Pour</p>
            </div>
        </a>
        
        <div id="end-div">
            <p><a href="#">Shop</a></p>
            <p><a href="#">About us</a></p>
            <a href="#">
                <img id="cart" src="./pics/cart.svg" alt="Shopping Cart">
            </a>
        </div>
    </div>

    <main class="product-container">
        <div class="product-card">
            <div class="product-image-area">
                <img src="./pics/arched.svg" alt="Cold Brew with Milk Coffee" />
            </div>

            <div class="product-details">
                <p class="product-price"><strong>(₱165.00)</strong></p>
                <p class="product-description">
                    Steeped slowly and blended softly with milk. Purr & Pour's Cold Brew with Milk embodies patience with grace. Its smooth, deep flavor invites you to unwind and savor the unhurried.
                </p>
                <div class="product-buttons">
                    <button class="h1bttn buy-now-btn">Buy Now</button>
                    <button class="add-to-cart-btn">Add to Cart</button>
                </div>
            </div>
        </div>
    </main>
    
    <add-footer></add-footer>
    
</body>
</html>
