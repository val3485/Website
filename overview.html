<!DOCTYPE html>
<html lang="en">
<head>
    <title>Our Coffees - Purr n Pour</title>
    <link rel="stylesheet" href="./css/mainlayout.css">
    <link rel="stylesheet" href="./css/category.css"> <script src="./js/footer.js" defer></script>
</head>
<body>
    
    <div class="dashboard">
        <a href="/">
            <div>
                <img id="logo" src="./pics/logo.svg" alt="Purr n Pour Logo">
                <p id="name">Purr n Pour</p>
            </div>
        </a>
        
        <div id="end-div">
            <p><a href="#">Shop</a></p>
            <p><a href="#">About us</a></p>
            <a href="#">
                <img id="cart" src="./pics/cart.svg" alt="Shopping Cart">
            </a>
        </div>
    </div>

    <main>
        <section class="hero-section">
            <img src="./pics/coffeebeans.svg" alt="Coffee Beans and Cups" class="hero-background-image">
        </section>

        <section class="product-category-section">
            <div class="category-header">
                <h1 class="category-title">HOT COFFEE</h1>
            </div>

            <div class="product-grid">
                <div class="product-item">
                    <img src="./pics/brew.svg" alt="Cold Brew with Milk" class="product-item-image">
                    <p class="product-item-name">Cold Brew with Milk</p>
                </div>

                <div class="product-item">
                    <img src="./pics/brew.svg" alt="Cold Brew with Milk" class="product-item-image">
                    <p class="product-item-name">Cold Brew with Milk</p>
                </div>

                <div class="product-item">
                    <img src="./pics/brew.svg" alt="Cold Brew with Milk" class="product-item-image">
                    <p class="product-item-name">Cold Brew with Milk</p>
                </div>
            </div>
        </section>
        <section class="product-category-section">
            <div class="category-header">
                <h1 class="category-title">COLD COFFEE</h1>
            </div>

            <div class="product-grid">
                <div class="product-item">
                    <img src="./pics/brew.svg" alt="Cold Brew with Milk" class="product-item-image">
                    <p class="product-item-name">Cold Brew with Milk</p>
                </div>

                <div class="product-item">
                    <img src="./pics/brew.svg" alt="Cold Brew with Milk" class="product-item-image">
                    <p class="product-item-name">Cold Brew with Milk</p>
                </div>

                <div class="product-item">
                    <img src="./pics/brew.svg" alt="Cold Brew with Milk" class="product-item-image">
                    <p class="product-item-name">Cold Brew with Milk</p>
                </div>
            </div>
        </section>
        <section class="product-category-section">
            <div class="category-header">
                <h1 class="category-title">NON COFFEE</h1>
            </div>

            <div class="product-grid">
                <div class="product-item">
                    <img src="./pics/brew.svg" alt="Cold Brew with Milk" class="product-item-image">
                    <p class="product-item-name">Cold Brew with Milk</p>
                </div>

                <div class="product-item">
                    <img src="./pics/brew.svg" alt="Cold Brew with Milk" class="product-item-image">
                    <p class="product-item-name">Cold Brew with Milk</p>
                </div>

                <div class="product-item">
                    <img src="./pics/brew.svg" alt="Cold Brew with Milk" class="product-item-image">
                    <p class="product-item-name">Cold Brew with Milk</p>
                </div>
            </div>
        </section>
    </main>
    
    <add-footer></add-footer>
    
</body>
</html>
