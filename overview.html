<!DOCTYPE html>
<head>
    <title>Our Coffees - Purr n Pour</title>
    <link rel="stylesheet" href="./css/mainlayout.css">
    <link rel="stylesheet" href="./css/category.css"> 
    <script  src="./mainlayout/footer.js" defer> </script>  
<body>
    
    <div class="dashboard">
        <a href="/">
            <div>
                <img id="logo" src="./pics/logo.svg" >
                <p id="name">Purr n Pour</p>
            </div>
        </a>
        
        <div id="end-div">
            <p><a href="#">Shop</a></p>
            <p><a href="#">About us</a></p>
            <a href="#">
                <img id="cart" src="./pics/cart.svg" >
            </a>
        </div>
    </div>

    <main>
        <div class="above-pic">
            <img src="./pics/coffeebeans.svg" class="above-pic-bg">
        </div>

        <section class="product-category">
            <div class="category-header">
                <h1 class="category-title">HOT-COFFEE</h1>
            </div>

            <div class="product-grid">
                <div class="product-item">
                    <img src="./pics/latte.svg" class="product-item-image">
                    <p class="product-item-name">Latte</p>
                </div>

                <div class="product-item">
                    <img src="./pics/flat white.svg" class="product-item-image">
                    <p class="product-item-name">Flat White</p>
                </div>

                <div class="product-item">
                    <img src="./pics/espresso.svg" class="product-item-image">
                    <p class="product-item-name">Espresso</p>
                </div>
            </div>

            <div class="category-header">
                <h1 class="category-title">COLD-COFFEE</h1>
            </div>

            <div class="product-grid">
                <div class="product-item">
                    <img src="./pics/affogato.svg" class="product-item-image">
                    <p class="product-item-name">Affogato</p>
                </div>

                <div class="product-item">
                    <img src="./pics/americano.svg" class="product-item-image">
                    <p class="product-item-name">Americano</p>
                </div>

                <div class="product-item">
                    <img src="./pics/brew.svg" class="product-item-image">
                    <p class="product-item-name">Cold Brew with Milk</p>
                </div>

                <div class="product-item">
                    <img src="./pics/caramel macchiato.svg" class="product-item-image">
                    <p class="product-item-name">Caramel Macchiato</p>
                </div>
            </div>
        
            <div class="category-header">
                <h1 class="category-title">NON-CAFFEINATED</h1>
            </div>

            <div class="product-grid">
                <div class="product-item">
                    <img src="./pics/lemonade.svg" class="product-item-image">
                    <p class="product-item-name">Lemonade</p>
                </div>

                <div class="product-item">
                    <img src="./pics/choco.svg" class="product-item-image">
                    <p class="product-item-name">Hot Chocolate</p>
                </div>
                
                <div class="product-item">
                    <img src="./pics/vanilla.svg" class="product-item-image">
                    <p class="product-item-name">Vanilla</p>
                </div>
            </div>
        </section>
    </main>
    
    <add-footer></add-footer>
    
</body>
</html>
