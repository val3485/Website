<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="../css/mainlayout.css">
    </head>

    <body >

        <div class="dash">
            <div>
                <img id="logo"  src="../pics/logo.svg">
                <p id="name">
                    Purr n Pour
                </p>
            </div>

            <div id="end-div">
                <!-- <p> -->
                    <p onclick="sidebar();sidebar2()">shop</p>
                <!-- </p> -->
                <p>About us</p>
                <img id="cart" src="../pics/cart.svg">
            </div>
                   
        </div>

        <div id="side-bar">
            <div >
                <img id="logo"  src="../pics/logo.svg">
                <p class="overview">
                    Overview of products
                </p>
              
            </div>

            <div id="d1">
                <div>
                    <img src="../pics/hot_coffee.svg">
                    <p>Hot Coffee</p>
                </div>
                <div>
                    <img src="../pics/coffee.svg">
                    <p>Coffee</p>
                </div>
                <div>
                    <img src="../pics/non_caffein.svg">
                    <p>Non-Caffeinated</p>
                </div>
            </div>
        </div>

        <script>
            //displays the sidebar 
            function sidebar (){
              const sb = document.getElementById("side-bar");
              //checks for the type of style
                if (sb.style.display == "block") {
                    sb.style.display = "none";
                } else {
                    sb.style.display = "block";
                }
            }  
        </script>

    </body>
</html>
